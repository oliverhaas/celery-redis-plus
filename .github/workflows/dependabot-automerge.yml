# Merges a Dependabot pull request once CI has passed on its head commit; --match-head-commit refuses the merge if the
# branch moved after that run. A merge made with GITHUB_TOKEN starts no other workflow, so CI does not run again on
# main afterwards.
name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$BRANCH"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
